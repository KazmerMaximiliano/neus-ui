name: Build & Deploy Storybook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build

      - name: Build Storybook
        run: pnpm exec storybook build --output-dir "${{ runner.temp }}/pages/storybook"

      - name: Redirect Pages entry point to Storybook
        run: |
          cat > "${{ runner.temp }}/pages/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./storybook/">
              <title>Neus UI Storybook</title>
            </head>
            <body><a href="./storybook/">Open Storybook</a></body>
          </html>
          HTML

      - name: Verify Pages artifact
        run: |
          test -f "${{ runner.temp }}/pages/index.html"
          test -f "${{ runner.temp }}/pages/storybook/index.html"
          ls -la "${{ runner.temp }}/pages/storybook/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
