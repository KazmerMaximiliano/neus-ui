name: Release

# Publishes to npm when a version tag (v1.0.0) is pushed. Needs the NPM_TOKEN repository
# secret: an npm automation or granular token with publish rights for neus-ui.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: |
          pnpm lint
          pnpm design:check
          pnpm test:unit
          pnpm test:design-systems

      # npm publish runs prepublishOnly (pnpm run build); --provenance links the package to this workflow run.
      - name: Publish to npm
        run: |
          if npm view "neus-ui@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "neus-ui@${GITHUB_REF_NAME#v} is already on npm; skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: |
          notes="$(awk -v version="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" version "\\]" {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md)"
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "${notes}"
        env:
          GH_TOKEN: ${{ github.token }}
