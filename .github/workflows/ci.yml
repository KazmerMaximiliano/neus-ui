name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Check generated design systems
        run: pnpm design:check

      - name: Unit, server rendering, CLI and generator tests
        run: pnpm test:unit

      - name: Browser tests in all six design systems
        run: pnpm test:design-systems

      - name: Build
        run: pnpm build

      - name: Check the package contents
        run: npm pack --dry-run
