<style>
  /* Preview chrome follows the active global recipe. Never target component tables. */
  html[data-color-scheme="dark"],
  html[data-color-scheme="dark"] body,
  html[data-color-scheme="dark"] #storybook-root,
  html[data-color-scheme="dark"] #storybook-docs,
  html[data-color-scheme="dark"] .sbdocs-wrapper,
  html[data-color-scheme="dark"] .sbdocs-content,
  html[data-color-scheme="dark"] .sbdocs-preview {
    background-color: var(--color-surface) !important;
    color: var(--color-text-primary);
  }

  html[data-color-scheme="dark"] .docblock-argstable,
  html[data-color-scheme="dark"] .docblock-argstable :is(th, td) {
    background-color: var(--color-surface-secondary) !important;
    color: var(--color-text-primary) !important;
    border-color: var(--color-border-subtle) !important;
  }

  html[data-color-scheme="dark"] .docblock-argstable tr:nth-child(even) td {
    background-color: var(--color-surface) !important;
  }

  html[data-color-scheme="dark"] .sbdocs-content > :is(h1, h2, h3, p) {
    color: var(--color-text-primary) !important;
  }

  html[data-color-scheme="dark"] .sb-bar {
    background-color: var(--color-surface-secondary) !important;
    border-color: var(--color-border-subtle) !important;
  }
</style>
